name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-audit:
    name: Lint, Audit & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Check required monorepo structure
        run: |
          for path in "apps/api" "apps/web" "apps/cms" "packages/types" "docker-compose.yml" "turbo.json"; do
            if [ ! -e "$path" ]; then
              echo "❌ Missing required path: $path"
              exit 1
            fi
          done
          echo "✅ All core monorepo packages and configurations present."

      - name: Validate legacy v1 preservation
        run: |
          if [ -f "legacy/v1/index.html" ] && [ -f "legacy/v1/script.js" ]; then
            node --check legacy/v1/script.js
            echo "✅ Legacy v1 static demo validated."
          fi
